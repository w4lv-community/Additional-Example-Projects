Project Description = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Segoe UI;}}{\colortbl;\red0\green0\blue0;\red0\green112\blue192;}\f0\fs20 {\b\fs22\sa110 Workers <-> Python gRPC Scope Example\par}\fs20 {\b IMPORTANT: Check that the NI gRPC packages listed below are installed before copying this example.}\par\par Download grpc-labview.zip from the NI gRPC LabVIEW repository on GitHub and install the three VI packages it contains:\par {\cf2 https://github.com/ni/grpc-labview/releases/download/v1.7.0.1/grpc-labview.zip}\par\par ni_lib_labview_grpc_library-1.7.0.1.vip\par ni_lib_labview_grpc_servicer-1.7.0.1.vip\par ni_lib_grpc_server_and_client_template[2]-1.7.0.1.vip\par\par This example project demonstrates how a Workers application can communicate with an application written in another programming language using gRPC. A LabVIEW Scope Simulator uses the gRPC Server Worker Template (available from the Worker User Library) to communicate with a Python/PySide6 client over a bidirectional gRPC stream.\par\par The example uses {\b scope.proto} as the shared API contract. Selected message payloads from the template have been adapted to exchange scope configuration, run/stop commands, device information, state, and continuously streamed waveform data.\par\par {\b\fs22\sa110 What You'll Learn:\par}\fs20 {\bullet} Connecting a Workers application to Python using gRPC\par {\bullet} Using the gRPC Server Worker to send and receive typed messages\par {\bullet} Adapting the template proto payloads for a real application\par {\bullet} Sending commands from Python to LabVIEW over a bidirectional stream\par {\bullet} Streaming waveform and status data continuously from LabVIEW to Python\par \par {\b Recommended for those wanting to communicate with a Python application via Worker Public APIs.}\par\par {\b\fs22\sa110 Instructions:\par}\fs20 See {\b README.md} in the example project folder for setup and run instructions. Python setup instructions are provided separately in {\b client-py/README.md}.\par\par }"
Workers Version = "5.1"
