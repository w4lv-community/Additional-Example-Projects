Project Description = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Arial;}}{\colortbl;\red0\green0\blue0;\red0\green112\blue192;}\f0\fs20 {\b\fs22\sa110 Sending Errors up the Worker call-chain\par}\fs20 This example project demonstrates three different methods for sending errors from a Worker's MHL or EHL up the Worker call-chain to its Caller or any Worker above it for centralized processing.\par\par {\b\fs22\sa110 What You'll Learn:\par}\fs20 {\bullet} Method 1: Sending errors using Public API Responses (simple, decoupled)\par {\bullet} Method 2: Using the framework's "Send Error to Owner" VI (no base class required)\par {\bullet} Method 3: Using recursive Public API Requests in a base class (application-wide propagation)\par \par {\b Ideal for applications requiring centralized error handling or collection.}\par\par Learn more here: {\cf2 https://community.workersforlabview.io/articles/post/sending-errors-up-the-worker-call-chain-AsyKSrGXxALHIvc}\par\par }"
