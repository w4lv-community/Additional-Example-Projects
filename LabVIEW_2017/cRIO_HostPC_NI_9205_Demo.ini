Project Description = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Segoe UI;}}{\colortbl;\red0\green0\blue0;\red0\green112\blue192;}\f0\fs20 {\b\fs22\sa110 GLA Summit 2025 cRIO Real-Time Demonstration\par}\fs20 This complete distributed application was demonstrated at GLA Summit 2025, showcasing Workers running on both a CompactRIO real-time target and Windows host PC, featuring FPGA data acquisition (NI 9205 module at 10kHz), TCP/IP streaming, and live visualization.\par\par {\b\fs22\sa110 What You'll Learn:\par}\fs20 {\bullet} Building distributed Workers applications across RT targets and host PCs\par {\bullet} Integrating FPGA data with Workers for high-speed data acquisition\par {\bullet} Using TCP Server and Client Workers for data streaming between host-to-RT\par \par {\b Complete working example demonstrating Workers architecture on real-time embedded systems.}\par\par Learn more here: {\cf2 https://community.workersforlabview.io/articles/post/workers-for-labview-on-ni-real-time-targets-xXewjoaf40HUsPs}\par\par ---\par\par {\b\fs22\sa110 Instructions:\par}\fs20 1. Run the Windows Host PC application first. Make sure that you press the {\b Start Listening on Port} button on the front panel of the applications' Main UI, so that the cRIO applicaiton will be able to connect to the Host PC application.\par\par 2. On the Launcher VI of the cRIO application, make sure you include the IP address of the Host PC.\par\par 3. Run the cRIO Launcher VI and the two applications should connect. You will see the data from the cRIO streamed to the Host PC application.\par\par 4. Safely shutdown the cRIO application remotely through the Workers Debug Server's Application Manager\par\par }"
