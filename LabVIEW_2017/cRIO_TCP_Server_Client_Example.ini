Project Description = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Segoe UI;}}{\colortbl;\red0\green0\blue0;\red0\green112\blue192;}\f0\fs20 {\b\fs22\sa110 cRIO <-> Host PC TCP Communication Example\par}\fs20 This example project demonstrates how to stream data between a Windows host PC and an NI real-time embedded target (CompactRIO) using the TCP Server and Client Workers, enabling distributed Workers applications across network-connected platforms.\par\par {\b\fs22\sa110 What You'll Learn:\par}\fs20 {\bullet} Deploying Workers applications on real-time embedded targets\par {\bullet} Establishing bidirectional TCP communication between host PC and cRIO platforms\par {\bullet} Building distributed control systems with remote monitoring and HMI capabilities\par \par {\b Ideal for applications requiring real-time control with remote monitoring or host-based HMI.}\par\par Learn more here: {\cf2 https://community.workersforlabview.io/articles/post/rt-communication-using-the-workers-tcp-libraries-usWCoZxdfpceKsw}\par\par }"
